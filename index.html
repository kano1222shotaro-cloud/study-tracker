<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>勉強+瞑想+アイケア 計画トラッカー</title>
<meta name="theme-color" content="#0a0e14">
<!--
  ※ このファイルは build.js が src/app.src.html から生成した配布用です。編集は src/ 側で行い、node build.js で再生成してください。

  v11 (2026-09-27): スマホでの起動が「読み込み中...」のまま30秒以上かかる問題への対策。
  ・起動時に Drive(GAS) の応答を待たず、端末内(localStorage)のデータで即表示 → 裏で Drive と統合する。
  ・同期を meal-tracker v6 と同じ原則に変更(sync-core.js)。記録は id 単位の和集合、分野・設定は項目ごとに新しい方、
    削除は墓標で伝播、全リセットは epoch。端末と GAS が同じ統合関数を使い、順序に依らず同じ結果になる。
  ・送信は操作後 0.4 秒でまとめて送る。画面を閉じる瞬間は sendBeacon で駆け込み送信。失敗時は自動再試行(2→4→…60秒)。
  ・受信は画面に戻った時・フォーカス・オンライン復帰・表示中は約1分ごと。通信は 20〜30 秒で時間切れ。
  ・GAS は v7(google-apps-script-v7.js): POST で Doc の内容と統合してから書く。GET はキャッシュから返す。
  ・配布用 index.html は React を同梱し JSX を事前コンパイル済み(unpkg・Babel への依存をなくした)。フォントは非同期読み込み。

  v10 (2026-08-09): 「1日ノルマ」と「分野別ノルマの合計」が食い違う不具合を修正。
  ・fieldActiveOn() を新設し、「その日その分野にノルマがあるか」の判定を1箇所に集約。
    今日の記録の分野別 / 割当% / チャートの計画線 / 遅れ日数 がすべて同じ基準になった。
    (旧: 割当%とチャートは完了予定日で打ち切るのに、今日の記録の分野別だけ打ち切らず、
     割当が100%を超えていても警告が出ないまま分野別の合計だけがノルマを超えていた)
  ・計画完了予定日を過ぎてもまだ読み終わっていない分野は、読了までノルマを出し続ける
    (分野一覧に「⌛ 予定日超過」バッジ)。過去日の計画・割当は一切変更しない。
  ・一時停止/再開の再配分候補を「その日ノルマが出る分野」に限定(開始前の分野が%を受け取る問題を修正)。
    「100%に整える」ボタンと、合計が100%でないときの警告を追加。
  ・今日の記録に、割当が100%でないときの説明カードを追加(100%未満も表示)。
  ・GAS(google-apps-script-v6.js)側の変更は不要

  v9 (2026-07-17): 分野の一時停止(ペンディング)/再開機能を追加。
  ・分野の割合(%)は履歴管理(pctHist)になり、停止/再開/%変更は「指定日から適用」で過去の計画は凍結される
  ・停止中はノルマ0、完了予定日は停止期間ぶん自動で後ろへ(再開日未定の間は「再開日未定」表示)
-->

// build.js が src/app.src.html と src/gas.src.js に差し込むので、直接編集するのはこのファイルだけ。
//
// 【役割】
//  1. migrate(state)      … 旧データに id / mt(更新時刻) / tomb(墓標) / mts / epoch を補う(冪等)
//  2. stamp(prev, next)   … 操作前後の状態を比べ、変わった記録・分野に mt を付け、消えた物に墓標を立てる
//  3. merge(a, b)         … 2つの状態を統合する(順序に依らず同じ結果。端末側もGAS側もこれを使う)
//
// 【統合ルール】
//  ・記録(勉強ログ・瞑想・アイケア): id 単位の和集合。同じ id は mt が新しい方。
//    削除は tomb[id]=削除時刻 で伝播し、mt <= 削除時刻 の記録は復活しない(墓標は90日で掃除)。
//  ・分野(本・割合履歴・一時停止を含む): 分野単位で mt が新しい方。削除は墓標。
//    本の pagesRead は記録から再計算する派生値なので比較に含めない(記録の追加で分野が"更新"扱いにならないように)。
//  ・目標スケジュール(戻す/進む履歴込み)・瞑想開始日・アイケア開始日: 項目ごとに mts[項目] が新しい方。
//  ・epoch(全リセット時刻): 大きい方を採用し、それより古い mt の記録・分野・設定はすべて捨てる。
//  ・旧データ(id なし)の id は「種別+日付+並び順」から決定的に作るので、PC とスマホで同じ id になる。
//  ・同時刻(tie)は正規化JSONの大きい方を選ぶ(両側で同じ結果になるための約束事。実用上ほぼ起きない)。
// ═══════════════════════════════════════════════════════════════════
var SyncCore = (function () {
  var SCHEMA = 7;
  var TOMB_KEEP_MS = 90 * 86400000;
  var MED_START_DEFAULT = "2026-05-05";
  var EYE_START_DEFAULT = "2026-07-11";

  function deepCopy(o) { return JSON.parse(JSON.stringify(o)); }
  function isObj(x) { return !!x && typeof x === "object" && !Array.isArray(x); }
  function gid() { return Math.random().toString(36).slice(2, 10); }
  function num(v) { return typeof v === "number" && isFinite(v) ? v : 0; }

  // キー順に依らない正規化JSON(比較用)
  function stableJson(v) {
    if (v === undefined) return "undefined";
    if (v === null || typeof v !== "object") return JSON.stringify(v);
    if (Array.isArray(v)) return "[" + v.map(stableJson).join(",") + "]";
    var keys = Object.keys(v).filter(function (k) { return v[k] !== undefined; }).sort();
    return "{" + keys.map(function (k) { return JSON.stringify(k) + ":" + stableJson(v[k]); }).join(",") + "}";
  }

  // ── 記録コレクションの定義 ──
  var COLS = [
    { key: "logs", prefix: "L",
      get: function (s) { return s.logs; },
      set: function (s, v) { s.logs = v; } },
    { key: "med", prefix: "M",
      get: function (s) { return s.meditation && s.meditation.sessions; },
      set: function (s, v) { if (!isObj(s.meditation)) s.meditation = { startDate: MED_START_DEFAULT }; s.meditation.sessions = v; } },
    { key: "eye", prefix: "E",
      get: function (s) { return s.eyeCare && s.eyeCare.sessions; },
      set: function (s, v) { if (!isObj(s.eyeCare)) s.eyeCare = { startDate: EYE_START_DEFAULT }; s.eyeCare.sessions = v; } }
  ];
  // 項目ごとに新しい方(mts[key])で決める設定
  var SETTINGS = [
    { key: "studySchedule", get: function (s) { return s.studySchedule; }, set: function (s, v) { if (v !== undefined) s.studySchedule = v; } },
    { key: "medSchedule",   get: function (s) { return s.medSchedule; },   set: function (s, v) { if (v !== undefined) s.medSchedule = v; } },
    { key: "medStart",      get: function (s) { return s.meditation ? s.meditation.startDate : undefined; },
                            set: function (s, v) { if (!isObj(s.meditation)) s.meditation = { sessions: {} }; if (v !== undefined) s.meditation.startDate = v; } },
    { key: "eyeStart",      get: function (s) { return s.eyeCare ? s.eyeCare.startDate : undefined; },
                            set: function (s, v) { if (!isObj(s.eyeCare)) s.eyeCare = { sessions: {} }; if (v !== undefined) s.eyeCare.startDate = v; } }
  ];

  // ── 形の補完 + 旧データへの id 付与(冪等) ──
  function ensureShape(st) {
    if (!isObj(st)) st = {};
    if (!Array.isArray(st.fields)) st.fields = [];
    if (!isObj(st.logs)) st.logs = {};
    if (!isObj(st.meditation)) st.meditation = { startDate: MED_START_DEFAULT, sessions: {} };
    if (!st.meditation.startDate) st.meditation.startDate = MED_START_DEFAULT;
    if (!isObj(st.meditation.sessions)) st.meditation.sessions = {};
    if (!isObj(st.eyeCare)) st.eyeCare = { startDate: EYE_START_DEFAULT, sessions: {} };
    if (!st.eyeCare.startDate) st.eyeCare.startDate = EYE_START_DEFAULT;
    if (!isObj(st.eyeCare.sessions)) st.eyeCare.sessions = {};
    if (!isObj(st.tomb)) st.tomb = {};
    if (!isObj(st.mts)) st.mts = {};
    st.epoch = num(st.epoch);
    st.lastModified = num(st.lastModified);
    return st;
  }
  function legacyId(prefix, day, idx) { return prefix + day + "_" + idx; }
  function assignIds(st) {
    COLS.forEach(function (c) {
      var days = c.get(st) || {};
      Object.keys(days).forEach(function (day) {
        var arr = days[day];
        if (!Array.isArray(arr)) { delete days[day]; return; }
        var clean = [];
        for (var i = 0; i < arr.length; i++) {
          var e = arr[i];
          if (!isObj(e)) continue;
          if (!e.id) e.id = legacyId(c.prefix, day, i);
          e.mt = num(e.mt);
          e.ct = num(e.ct);
          clean.push(e);
        }
        if (clean.length) days[day] = clean; else delete days[day];
      });
      c.set(st, days);
    });
    st.fields = st.fields.filter(function (f) { return isObj(f) && f.id; });
    st.fields.forEach(function (f) { f.mt = num(f.mt); if (!Array.isArray(f.books)) f.books = []; });
    return st;
  }
  function migrate(state) {
    var st = ensureShape(isObj(state) ? deepCopy(state) : {});
    assignIds(st);
    st.schemaVersion = SCHEMA;
    return st;
  }

  // ── 比較用の内容(id/mt を除く。分野は pagesRead も除く) ──
  function entryContent(e) { var o = {}; Object.keys(e).forEach(function (k) { if (k !== "id" && k !== "mt" && k !== "ct") o[k] = e[k]; }); return o; }
  function fieldContent(f) {
    var o = {};
    Object.keys(f).forEach(function (k) { if (k !== "mt") o[k] = f[k]; });
    o.books = (f.books || []).map(function (b) { var c = {}; Object.keys(b).forEach(function (k) { if (k !== "pagesRead") c[k] = b[k]; }); return c; });
    return o;
  }

  // ── 記録一覧の走査 ──
  function collect(st, col) { // → [{day, idx, e}]
    var out = [], days = col.get(st) || {};
    Object.keys(days).sort().forEach(function (day) {
      var arr = days[day]; if (!Array.isArray(arr)) return;
      for (var i = 0; i < arr.length; i++) if (isObj(arr[i])) out.push({ day: day, idx: i, e: arr[i] });
    });
    return out;
  }

  // ── stamp: 操作前後の差分に mt / 墓標を付ける ──
  // prev は migrate 済み(id 付き)の直前状態、next は UI が作った新しい状態(新規記録は id なしでよい)。
  // 返り値は id/mt/墓標が整った next のコピー。
  function stamp(prev, next, now) {
    now = num(now) || Date.now();
    var p = migrate(prev);
    var n = ensureShape(isObj(next) ? deepCopy(next) : {});
    n.tomb = deepCopy(p.tomb || {});
    n.mts = deepCopy(p.mts || {});
    if (isObj(next) && isObj(next.tomb)) Object.keys(next.tomb).forEach(function (k) { if (!(n.tomb[k] >= next.tomb[k])) n.tomb[k] = num(next.tomb[k]); });
    if (isObj(next) && isObj(next.mts)) Object.keys(next.mts).forEach(function (k) { if (!(n.mts[k] >= next.mts[k])) n.mts[k] = num(next.mts[k]); });
    n.epoch = Math.max(num(p.epoch), num(next && next.epoch));
    // 記録
    COLS.forEach(function (c) {
      var prevMap = {};
      collect(p, c).forEach(function (x) { prevMap[x.e.id] = x; });
      var days = c.get(n) || {};
      var nextIds = {};
      Object.keys(days).forEach(function (day) { (days[day] || []).forEach(function (e) { if (isObj(e) && e.id) nextIds[e.id] = true; }); });
      Object.keys(days).forEach(function (day) {
        var arr = days[day];
        if (!Array.isArray(arr)) { delete days[day]; return; }
        var clean = [];
        for (var i = 0; i < arr.length; i++) {
          var e = arr[i];
          if (!isObj(e)) continue;
          if (e.id && prevMap[e.id]) {
            var old = prevMap[e.id];
            if (old.day !== day || stableJson(entryContent(old.e)) !== stableJson(entryContent(e))) e.mt = now;
            else e.mt = num(old.e.mt);
            e.ct = num(old.e.ct);
          } else if (e.id) {
            e.mt = num(e.mt) || now; // 外から持ち込まれた id 付き記録(復元など)
            e.ct = num(e.ct) || e.mt;
          } else {
            // id なし = UI が新規/編集した記録。同じ日・同じ位置に居た旧記録が next のどこにも無ければ「編集」として id を引き継ぐ
            var pd = (c.get(p) || {})[day];
            var cand = Array.isArray(pd) ? pd[i] : null;
            if (cand && cand.id && !nextIds[cand.id]) { e.id = cand.id; nextIds[cand.id] = true; e.ct = num(cand.ct); }
            else { e.id = gid(); e.ct = now; }
            e.mt = now;
          }
          clean.push(e);
        }
        if (clean.length) days[day] = clean; else delete days[day];
      });
      c.set(n, days);
      var alive = {};
      collect(n, c).forEach(function (x) { alive[x.e.id] = true; });
      Object.keys(prevMap).forEach(function (id) { if (!alive[id]) n.tomb[id] = now; });
    });
    // 分野
    var pf = {};
    p.fields.forEach(function (f) { pf[f.id] = f; });
    n.fields = n.fields.filter(function (f) { return isObj(f) && f.id; });
    var nfIds = {};
    n.fields.forEach(function (f) {
      nfIds[f.id] = true;
      if (!Array.isArray(f.books)) f.books = [];
      var old = pf[f.id];
      if (!old) f.mt = now;
      else if (stableJson(fieldContent(old)) !== stableJson(fieldContent(f))) f.mt = now;
      else f.mt = num(old.mt);
    });
    Object.keys(pf).forEach(function (id) { if (!nfIds[id]) n.tomb[id] = now; });
    // 設定
    SETTINGS.forEach(function (s) {
      var a = s.get(p), b = s.get(n);
      if (stableJson(a) !== stableJson(b)) n.mts[s.key] = now;
      else if (n.mts[s.key] === undefined && p.mts && p.mts[s.key] !== undefined) n.mts[s.key] = p.mts[s.key];
    });
    pruneTomb(n.tomb, now);
    n.lastModified = now;
    n.schemaVersion = SCHEMA;
    return n;
  }

  function pruneTomb(tomb, now) {
    var cut = now - TOMB_KEEP_MS;
    Object.keys(tomb).forEach(function (k) { if (!(num(tomb[k]) > cut)) delete tomb[k]; });
    return tomb;
  }

  // 自然順(数値部分を数として)の id 比較。旧データ id "L2026-03-23_10" の並びを保つため
  function idCmp(a, b) {
    var ma = /^(.*)_(\d+)$/.exec(a), mb = /^(.*)_(\d+)$/.exec(b);
    if (ma && mb && ma[1] === mb[1]) return Number(ma[2]) - Number(mb[2]);
    return a < b ? -1 : a > b ? 1 : 0;
  }
  function pickNewer(x, y, keyFn) { // x,y: {mt, ...}。mt が大きい方。同時刻は正規化JSONの大きい方(対称性のため)
    var mx = num(x.mt), my = num(y.mt);
    if (mx !== my) return mx > my ? x : y;
    var kf = keyFn || stableJson;
    return kf(x) >= kf(y) ? x : y;
  }
  function fieldKey(f) { return stableJson(fieldContent(f)); }

  // ── merge: 2つの状態の統合(対称・冪等) ──
  function merge(a, b, now) {
    now = num(now) || Date.now();
    var A = migrate(a), B = migrate(b);
    var out = ensureShape({});
    out.epoch = Math.max(A.epoch, B.epoch);
    // 墓標: 和集合(新しい方)
    var tomb = {};
    [A.tomb, B.tomb].forEach(function (t) { Object.keys(t || {}).forEach(function (k) { var v = num(t[k]); if (v > (tomb[k] || 0)) tomb[k] = v; }); });
    pruneTomb(tomb, now);
    out.tomb = tomb;
    var epoch = out.epoch;
    function alive(item) {
      var mt = num(item.mt);
      if (tomb[item.id] !== undefined && tomb[item.id] >= mt) return false;
      if (epoch > 0 && mt < epoch) return false;
      return true;
    }
    // 記録: id 単位の和集合
    COLS.forEach(function (c) {
      var best = {};
      [A, B].forEach(function (S) {
        collect(S, c).forEach(function (x) {
          var cur = best[x.e.id];
          var cand = { day: x.day, e: x.e, mt: num(x.e.mt) };
          if (!cur) best[x.e.id] = cand;
          else {
            var w = pickNewer({ mt: cur.mt, day: cur.day, e: cur.e }, { mt: cand.mt, day: cand.day, e: cand.e });
            best[x.e.id] = { day: w.day, e: w.e, mt: w.mt };
          }
        });
      });
      var days = {};
      Object.keys(best).forEach(function (id) {
        var x = best[id];
        if (!alive(x.e)) return;
        if (!days[x.day]) days[x.day] = [];
        days[x.day].push(deepCopy(x.e));
      });
      Object.keys(days).forEach(function (day) {
        // 表示順は作成順(ct)。旧データ(ct=0)は id の並び順(=元の並び)を保つ
        days[day].sort(function (p, q) { var d = num(p.ct) - num(q.ct); return d !== 0 ? d : idCmp(p.id, q.id); });
      });
      c.set(out, days);
    });
    // 分野: 分野単位で新しい方。順序は A の順 → B にしか無い物を後ろへ
    var fm = {}, order = [];
    [A, B].forEach(function (S) {
      S.fields.forEach(function (f) {
        if (!fm[f.id]) { fm[f.id] = f; order.push(f.id); }
        else fm[f.id] = pickNewer(fm[f.id], f, fieldKey);
      });
    });
    out.fields = order.filter(function (id) { return alive(fm[id]); }).map(function (id) { return deepCopy(fm[id]); });
    // 設定: 項目ごとに新しい方
    out.mts = {};
    SETTINGS.forEach(function (s) {
      var ta = num(A.mts[s.key]), tb = num(B.mts[s.key]);
      var va = s.get(A), vb = s.get(B);
      var win;
      if (va === undefined && vb === undefined) return;
      if (va === undefined) win = { t: tb, v: vb };
      else if (vb === undefined) win = { t: ta, v: va };
      else if (ta !== tb) win = ta > tb ? { t: ta, v: va } : { t: tb, v: vb };
      else win = stableJson(va) >= stableJson(vb) ? { t: ta, v: va } : { t: tb, v: vb };
      if (epoch > 0 && win.t < epoch) { // リセット後は既定値に戻す(リセット側の値が勝つはずだが保険)
        var alt = (win.v === va) ? { t: tb, v: vb } : { t: ta, v: va };
        if (!(alt.t >= epoch)) return;
        win = alt;
      }
      s.set(out, deepCopy(win.v));
      if (win.t) out.mts[s.key] = win.t;
    });
    // その他の項目(将来の拡張用): lastModified が新しい側の値を採用
    var newer = A.lastModified >= B.lastModified ? A : B, older = newer === A ? B : A;
    var known = { fields: 1, logs: 1, meditation: 1, eyeCare: 1, tomb: 1, mts: 1, epoch: 1, lastModified: 1, schemaVersion: 1, studySchedule: 1, medSchedule: 1 };
    [older, newer].forEach(function (S) { Object.keys(S).forEach(function (k) { if (!known[k]) out[k] = deepCopy(S[k]); }); });
    out.lastModified = Math.max(A.lastModified, B.lastModified);
    out.schemaVersion = SCHEMA;
    recalcPagesRead(out);
    return out;
  }

  // logs を唯一の情報源として pagesRead を再計算(index.html と同じ規則)
  function recalcPagesRead(ns) {
    var sums = {};
    Object.keys(ns.logs || {}).forEach(function (d) {
      var arr = ns.logs[d]; if (!Array.isArray(arr)) return;
      arr.forEach(function (e) { if (isObj(e)) sums[e.bid] = (sums[e.bid] || 0) + num(e.pg); });
    });
    ns.fields = (ns.fields || []).map(function (f) {
      var nf = deepCopy(f);
      nf.books = (f.books || []).map(function (b) { var nb = deepCopy(b); nb.pagesRead = Math.min(sums[b.id] || 0, num(b.totalPages)); return nb; });
      return nf;
    });
    return ns;
  }

  // 内容が同じか(lastModified と墓標の掃除差は無視)。「送る必要があるか」の判定に使う
  function contentKey(st) {
    var s = migrate(st);
    delete s.lastModified;
    delete s.schemaVersion;
    s.fields = s.fields.map(function (f) { var c = fieldContent(f); c.mt = f.mt; return c; }); // pagesRead は派生値なので除く
    return stableJson(s);
  }
  function sameContent(a, b) { return contentKey(a) === contentKey(b); }

  function countEntries(st) {
    var s = isObj(st) ? st : {};
    var n = 0;
    COLS.forEach(function (c) { var days = c.get(s) || {}; Object.keys(days).forEach(function (d) { if (Array.isArray(days[d])) n += days[d].length; }); });
    return n;
  }
  function hasData(d) {
    if (!isObj(d)) return false;
    if (Array.isArray(d.fields) && d.fields.length > 0) return true;
    if (d.meditation && isObj(d.meditation.sessions) && Object.keys(d.meditation.sessions).length > 0) return true;
    if (d.eyeCare && isObj(d.eyeCare.sessions) && Object.keys(d.eyeCare.sessions).length > 0) return true;
    return false;

  return {
    SCHEMA: SCHEMA, TOMB_KEEP_MS: TOMB_KEEP_MS,
    migrate: migrate, stamp: stamp, merge: merge,

</script>

<div id="root"></div>
<script>
const {
  useState,
  useEffect,
  useCallback,
  useMemo,
  useRef
} = React;

// ═══ Constants (Study) ═══
const GS = "2026-03-23";
const RAMP = 140;
const B0 = 1,
  B1 = 50;
const INCR = (B1 - B0) / (RAMP - 1);
// 平日/休日の1日あたり増加率（休日は1.5倍）。目標変更時のランプにも使用。
const WEEKDAY_INCR = INCR;
const WEEKEND_INCR = INCR * 1.5;

// ═══ Constants (Meditation) ═══
const MED_START_DEFAULT = "2026-05-05";
const MED_COLOR = "#a78bfa";
const MED_SLOTS = ["朝", "夜", "その他"];
const MED_PRACTICES = ["数息観", "隨息観", "只管打坐"];

// ═══ Constants (Eye care / アイケア) ═══
// ドライアイ対策: 毎日10分目を温める。目標は10分/日で固定(プログラム進行なし)。
const EYE_START_DEFAULT = "2026-07-11";
const EYE_COLOR = "#fb923c";
const EYE_TARGET_MIN = 10;
const EYE_SLOTS = MED_SLOTS;

// ═══ Date utils (timezone-safe) ═══
function toStr(d) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}
function parseD(s) {
  const [y, m, d] = s.split("-").map(Number);
  return new Date(y, m - 1, d);
}
function today() {
  return toStr(new Date());
}
function diffD(a, b) {
  return Math.round((parseD(b) - parseD(a)) / 86400000);
}
function addD(s, n) {
  const d = parseD(s);
  d.setDate(d.getDate() + n);
  return toStr(d);
}
function isWe(s) {
  const w = parseD(s).getDay();
  return w === 0 || w === 6;
}
function fF(s) {
  const d = parseD(s);
  return `${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()}`;
}
function fS(s) {
  const d = parseD(s);
  return `${d.getMonth() + 1}/${d.getDate()}`;
}
function dw(s) {
  return ["日", "月", "火", "水", "木", "金", "土"][parseD(s).getDay()];
}

// ═══ Schedule (Study) ═══

const GENESIS_SEG = {

// ═══ Core calc (Study) ═══

// ═══ その日その分野に「ノルマ(割当)があるか」の唯一の判定 ═══

// 目標変更を適用(今日から)。過去は seed として凍結。undo/redo 用に past/future 更新。

// ═══ 割合の変更・一時停止(ペンディング)・再開 (すべて履歴ベースで過去は不変) ═══
// fromDate 以降の各分野の割合を targets{fieldId:%} の値に確定する。
// ・fromDate 以降に予定されていた割合変更は置き換えられる(それ以前の履歴は不変)
// ・opts.restoreAt: その日に各対象分野を「fromDate時点の割合」へ自動復帰させる(再開予定日)
// ・opts.pauseFid: 一時停止した分野のid(停止メタ情報 pause={since,until,snapshot} を付与)

  const snapshot = {};
  state.fields.forEach(f => {
    snapshot[f.id] = fieldPctOn(f, fromDate);
  });
  const fields = state.fields.map(f => {
    const has = Object.prototype.hasOwnProperty.call(targets, f.id);
    if (!has && o.pauseFid !== f.id && o.resumeFid !== f.id) return f;
    const nf = {
      ...f

    if (has) {
      let hist = setPctFrom(getPctHist(f), fromDate, targets[f.id]);
      if (o.restoreAt && o.restoreAt > fromDate && Math.abs(snapshot[f.id] - targets[f.id]) > 1e-9) {

          from: o.restoreAt,
          pct: snapshot[f.id]

      nf.pctHist = hist;
      nf.pct = pctOnHist(hist, t);

      until: o.restoreAt || null,

// 分野編集画面での%変更を履歴に反映する。

      ...s,
      from: newStartDate
    } : s));
  }
